name: Monthly Vendor Payout Report

on:
  schedule:
    - cron: '0 6 1 * *'   # 6 AM UTC on the 1st of every month
  workflow_dispatch:       # Allow manual trigger any time

jobs:
  payout-report:
    name: Generate Payout Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate payout report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          REPORT_PERIOD: ${{ github.event.inputs.period || '' }}
        run: node scripts/generate-payout-report.js

      - name: Upload report to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          PERIOD=$(date -u +%Y-%m --date="last month")
          aws s3 cp ./reports/payout-$PERIOD.json \
            s3://$R2_BUCKET/reports/payouts/payout-$PERIOD.json \
            --endpoint-url $R2_ENDPOINT

      - name: Send operator notification
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
        run: node scripts/notify-payout-ready.js
