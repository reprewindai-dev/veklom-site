name: DB Schema Snapshot

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 3AM UTC
  workflow_dispatch:

jobs:
  snapshot:
    name: Dump Supabase schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dump schema to file
        run: supabase db dump --schema public > supabase/schema-snapshot.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add supabase/schema-snapshot.sql
          git diff --staged --quiet || git commit -m 'chore: weekly DB schema snapshot'
          git push
