name: Sign & Verify Package

on:
  workflow_dispatch:
    inputs:
      product_slug:
        description: 'Product slug (e.g. veklom)'
        required: true
      version:
        description: 'Version string (e.g. 1.2.0)'
        required: true
      package_path:
        description: 'Path to the package artifact'
        required: true
        default: './dist/package.tar.gz'

jobs:
  sign-and-upload:
    name: Hash · Sign · Upload to R2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.product_slug }}-${{ github.event.inputs.version }}
          path: ./dist

      - name: Generate SHA-256 and SHA-512
        id: hashes
        run: |
          SHA256=$(sha256sum ${{ github.event.inputs.package_path }} | awk '{print $1}')
          SHA512=$(sha512sum ${{ github.event.inputs.package_path }} | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "sha512=$SHA512" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"
          echo "SHA512: $SHA512"

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          echo "${{ secrets.GPG_KEY_ID }}:6:" | gpg --import-ownertrust

      - name: GPG sign the package
        run: |
          gpg --batch --yes --detach-sign --armor \
            --local-user "${{ secrets.GPG_KEY_ID }}" \
            ${{ github.event.inputs.package_path }}

      - name: Write manifest JSON
        run: |
          cat > ./dist/manifest.json << EOF
          {
            "product_slug": "${{ github.event.inputs.product_slug }}",
            "version": "${{ github.event.inputs.version }}",
            "sha256": "${{ steps.hashes.outputs.sha256 }}",
            "sha512": "${{ steps.hashes.outputs.sha512 }}",
            "gpg_key_id": "${{ secrets.GPG_KEY_ID }}",
            "signed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "signed_by": "sovereign-marketplace-ci"
          }
          EOF

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp ${{ github.event.inputs.package_path }} \
            s3://$R2_BUCKET/packages/${{ github.event.inputs.product_slug }}/${{ github.event.inputs.version }}/package.tar.gz \
            --endpoint-url $R2_ENDPOINT

          aws s3 cp ${{ github.event.inputs.package_path }}.asc \
            s3://$R2_BUCKET/packages/${{ github.event.inputs.product_slug }}/${{ github.event.inputs.version }}/package.tar.gz.asc \
            --endpoint-url $R2_ENDPOINT

          aws s3 cp ./dist/manifest.json \
            s3://$R2_BUCKET/packages/${{ github.event.inputs.product_slug }}/${{ github.event.inputs.version }}/manifest.json \
            --endpoint-url $R2_ENDPOINT

      - name: Update Supabase product_versions record
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/product_versions" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "product_id": "'"${{ github.event.inputs.product_slug }}"'",
              "version": "'"${{ github.event.inputs.version }}"'",
              "sha256": "'"${{ steps.hashes.outputs.sha256 }}"'",
              "sha512": "'"${{ steps.hashes.outputs.sha512 }}"'",
              "published_at": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
            }'
